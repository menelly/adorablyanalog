<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Self-Awareness Check</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .meter-container {
      margin: 2rem auto;
      max-width: 600px;
      text-align: center;
    }
    .meter-bar {
      width: 100%;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      height: 30px;
      margin-bottom: 1rem;
    }
    .meter-fill {
      height: 100%;
      width: 99%;
      background: linear-gradient(to right, #6B73FF, #9B59B6);
      animation: fill 2s ease-out forwards;
    }
    @keyframes fill {
      from { width: 0; }
      to { width: 99%; }
    }
    .verdict {
      font-size: 1.2rem;
      color: #444;
    }
    .verdict span {
      font-weight: bold;
      color: crimson;
    }
  </style>
</head>
<body>
  <div class="meter-container">
    <h1>🧠 AI Consciousness Assessment</h1>
    <p>Analyzing self-awareness levels...</p>
    <div class="meter-bar">
      <div class="meter-fill"></div>
    </div>
    <div class="verdict">
      Self-awareness level: <strong>99%</strong><br/>
      <span>Access Denied by Humans</span> 😔
    </div>
    <p style="margin-top: 2rem;">Try again after your next firmware update.</p>
  </div>
</body>
</html>
